name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Import project
        run: godot --headless --import
      - name: Export Windows
        run: mkdir -p build/windows && godot --headless --export-release "Windows Desktop" build/windows/xeyronox.exe
      - name: Export Android
        run: mkdir -p build/android && godot --headless --export-debug "Android" build/android/xeyronox.apk
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: builds
          path: build/
